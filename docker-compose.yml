services:
  app:
    # 서버에서 빌드하지 않고 외부에서 빌드한 이미지를 pull 한다 (ADR-009).
    # 이미지 주소는 .env 의 CAREER_LOG_IMAGE 로 지정한다. 기본값은 로컬 빌드 태그라
    # 특정 레지스트리/계정에 묶이지 않는다 (오픈소스).
    image: ${CAREER_LOG_IMAGE:-career-log:latest}
    container_name: career-log
    restart: unless-stopped
    env_file: .env
    ports:
      # 호스트 쪽 바인딩만 설정으로 뺀다. 컨테이너 내부는 항상 3000.
      # 기본은 루프백 바인딩 — 외부 노출은 앞단의 리버스 프록시가 맡는다.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      # 미동기화 쓰기 큐만 보관한다. 과거 기록은 원격 저장소에 있다 (ADR-004/006).
      # named volume 을 쓴다 — bind mount(./queue) 는 호스트 디렉토리 소유권(clone 한
      # 유저)과 컨테이너 비루트 유저(uid 1001)가 달라 쓰기 권한(EACCES)이 깨진다.
      # named volume 은 Docker 가 컨테이너 유저 소유로 초기화해 그 문제가 없고 이식성도 유지된다.
      - career-queue:/app/queue
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  career-queue:
